<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELETRO PRIME - Produto</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><div class="topbar"><a class="brand" href="/">⚡ ELETRO <b>PRIME</b></a><div class="head-actions"><button onclick="location.href='/'">← Voltar para a loja</button><button>🛒</button></div></div></header><main class="product-page"><div id="productDetails">Carregando produto...</div></main><script src="/app.js"></script><script>
const id=Number(new URLSearchParams(location.search).get('id'));
async function loadProduct(){try{const p=await fetch('/api/products').then(r=>{if(!r.ok)throw new Error('Produtos não encontrados');return r.json()}).then(products=>products.find(x=>x.id===id)); if(!p) throw new Error('Produto não encontrado');window.produtoAtual=p;const price=p.sale_price??p.price;const discount=p.sale_price?Math.round((1-p.sale_price/p.price)*100):0;document.title=p.name+' - ELETRO PRIME';document.querySelector('#productDetails').innerHTML=`<div class="product-detail"><div class="product-detail-image" id="productVisual"><div class="floating-product-orbit"><img class="product-floating-img" id="productFloatingImage" src="${p.image||'/placeholder.svg'}" alt="${p.name}"></div></div><div class="product-detail-info">${p.sale_price?`<span class="offer-badge">🔥 OFERTA ${discount}% OFF</span>`:''}<h1>${escapeHtml(p.name)}</h1><div>⭐⭐⭐⭐⭐ <span>4,9</span></div>${p.sale_price?`<div class="price-old">${money(p.price)}</div>`:''}<div class="price">${money(price)}</div><div class="pix">${money(price*.97)} no Pix</div><button class="gold-btn" onclick="comprarAgora()">🛒 Comprar agora</button><button class="cart-detail-btn" onclick="adicionarCarrinho()">🛒 Adicionar ao carrinho</button><div class="quantity-control"><strong>Quantidade:</strong><button onclick="changeQuantity(-1)">−</button><span id="productQuantity">1</span><button onclick="changeQuantity(1)">+</button></div><div class="stock-info">📦 Em estoque: <strong>${p.stock??0} unidades</strong></div><div class="product-benefits"><div class="benefit">📦<div><strong>Entrega para todo o Brasil</strong><span>Consulte o prazo para sua região</span></div></div><div class="benefit">💳<div><strong>Pagamento seguro</strong><span>Pix, crédito e débito</span></div></div><div class="benefit">🔒<div><strong>Compra segura</strong><span>Seus dados protegidos</span></div></div></div></div></div><section class="product-description-section"><h2>Descrição do produto</h2>${p.description?`<p class="product-description-text">${escapeHtml(p.description)}</p>`:''}<ul class="product-specs-list">${String(p.specs||'').split(/[;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></section>${p.video?`<section class="product-video-section"><h2>Vídeo do produto</h2><video class="product-video" controls playsinline src="${p.video}"></video></section>`:''}`;setup3D()}catch(e){document.querySelector('#productDetails').innerHTML='<h2>Não foi possível carregar este produto.</h2>';console.error(e)}}
function setup3D(){const v=document.querySelector('#productVisual'),img=document.querySelector('#productFloatingImage');if(!v||!img)return;v.addEventListener('mousemove',e=>{const r=v.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;img.style.setProperty('--rx',(-y*5).toFixed(2)+'deg');img.style.setProperty('--ry',(x*7).toFixed(2)+'deg');img.style.setProperty('--rz',(x*1.2).toFixed(2)+'deg');img.style.setProperty('--mx',(x*10).toFixed(1)+'px');img.style.setProperty('--my',(y*7).toFixed(1)+'px')});v.addEventListener('mouseleave',()=>['rx','ry','rz','mx','my'].forEach((x,i)=>img.style.setProperty('--'+x,['0deg','0deg','0deg','0px','0px'][i])))}
function changeQuantity(n){const e=document.querySelector('#productQuantity');e.textContent=Math.max(1,Number(e.textContent)+n)}
function adicionarCarrinho(mostrarModal = true){
  const q = Number(document.querySelector('#productQuantity').textContent);
  const c = JSON.parse(localStorage.getItem('ep_cart') || '[]');
  const e = c.find(x => x.id === produtoAtual.id);

  if(e) e.qty += q;
  else c.push({
    id: produtoAtual.id,
    name: produtoAtual.name,
    price: produtoAtual.sale_price ?? produtoAtual.price,
    image: produtoAtual.image,
    qty: q
  });

  localStorage.setItem('ep_cart', JSON.stringify(c));

  if(mostrarModal){
    document.querySelector('#loginRequiredContent').style.display = 'none';
    document.querySelector('#productAddedContent').style.display = 'block';
    document.querySelector('#purchaseModal').classList.add('active');
  }
}

function comprarAgora(){
  const customer = localStorage.getItem('ep_customer');

  if(!customer){
    document.querySelector('#loginRequiredContent').style.display = 'block';
    document.querySelector('#productAddedContent').style.display = 'none';
    document.querySelector('#purchaseModal').classList.add('active');
    return;
  }

  adicionarCarrinho(true);
}

function closePurchaseModal(){
  document.querySelector('#purchaseModal').classList.remove('active');
}

loadProduct();
</script>

<style>
.purchase-modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
.purchase-modal.active{display:flex}
.purchase-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
}
.purchase-box{
  position:relative;
  z-index:2;
  width:min(92%,460px);
  padding:32px;
  border-radius:22px;
  background:#101827;
  border:1px solid rgba(224,173,79,.35);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  color:#fff;
  text-align:center;
}
.purchase-close{
  position:absolute;
  right:14px;
  top:10px;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:25px;
  cursor:pointer;
}
.purchase-icon{font-size:44px;margin-bottom:10px}
.purchase-icon.success{color:#e0ad4f}
.purchase-box h2{margin:8px 0 12px;color:#fff}
.purchase-box p{color:#cbd2df;line-height:1.55;margin:0 0 22px}
.purchase-primary,.purchase-secondary,.purchase-payment{
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:14px 18px;
  margin-top:10px;
  border-radius:11px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}
.purchase-primary{border:0;background:#e0ad4f;color:#111}
.purchase-secondary{border:1px solid rgba(224,173,79,.45);background:transparent;color:#fff}
.purchase-payment{border:0;background:#fff;color:#111}
</style>

<div id="purchaseModal" class="purchase-modal">
  <div class="purchase-overlay" onclick="closePurchaseModal()"></div>
  <div class="purchase-box">
    <button type="button" class="purchase-close" onclick="closePurchaseModal()">×</button>

    <div id="loginRequiredContent">
      <div class="purchase-icon">🔐</div>
      <h2>Entre na sua conta para continuar</h2>
      <p>Para comprar na <strong>ELETRO PRIME</strong>, é necessário ter uma conta.</p>
      <button type="button" class="purchase-primary" onclick="location.href='/login.html'">Entrar na minha conta</button>
      <button type="button" class="purchase-secondary" onclick="location.href='/cadastro.html'">Criar minha conta</button>
    </div>

    <div id="productAddedContent" style="display:none;">
      <div class="purchase-icon success">✓</div>
      <h2>Produto adicionado ao carrinho!</h2>
      <p>O produto foi adicionado com sucesso. O que você deseja fazer agora?</p>
      <button type="button" class="purchase-primary" onclick="closePurchaseModal()">Continuar comprando</button>
      <button type="button" class="purchase-secondary" onclick="location.href='/carrinho.html'">🛒 Ver meu carrinho</button>
      <button type="button" class="purchase-payment" onclick="location.href='/checkout.html'">💳 Ir direto para o pagamento</button>
    </div>
  </div>
</div>

</body></html>

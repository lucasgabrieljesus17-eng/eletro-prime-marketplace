<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eletro Prime - Carrinho</title>
<link rel="stylesheet" href="/styles.css">
<style>
.ep-cart-page{max-width:1100px;margin:40px auto;padding:0 20px 70px}
.ep-cart-page h1{color:#fff;margin-bottom:25px}
.ep-cart-box{background:#0d1422;border:1px solid rgba(224,173,79,.18);border-radius:20px;padding:24px;box-shadow:0 18px 45px rgba(0,0,0,.2)}
.ep-cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ep-cart-item:last-child{border-bottom:0}
.ep-cart-item img{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:12px}
.ep-cart-name{color:#fff;font-weight:800}.ep-cart-price{color:#e0ad4f;font-weight:800;margin-top:6px}
.ep-cart-controls{display:flex;align-items:center;gap:8px;margin-top:10px}
.ep-cart-controls button{border:1px solid rgba(255,255,255,.15);background:#172033;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.ep-cart-remove{background:transparent!important;color:#ff8d8d!important;border:0!important;cursor:pointer}
.ep-cart-total{display:flex;justify-content:space-between;color:#fff;font-size:22px;font-weight:900;margin-top:25px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.ep-cart-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.ep-cart-actions button,.ep-cart-actions a{padding:14px 20px;border-radius:11px;text-decoration:none;border:1px solid rgba(224,173,79,.4);cursor:pointer;font-weight:800}
.ep-primary{background:#e0ad4f;color:#111}.ep-secondary{background:transparent;color:#fff}
.ep-empty{color:#b8c0d0;text-align:center;padding:45px}
@media(max-width:700px){.ep-cart-item{grid-template-columns:70px 1fr}.ep-cart-item>div:last-child{grid-column:2}.ep-cart-item img{width:70px;height:70px}}
</style>
</head>
<body>
<header class="top"><div class="topbar">
<a class="brand" href="/">⚡ <span>ELETRO <b>PRIME</b></span></a>
<div class="head-actions"><button onclick="location.href='/'">← Continuar comprando</button></div>
</div></header>

<main class="ep-cart-page">
<h1>🛒 Meu carrinho</h1>
<div class="ep-cart-box">
<div id="cartList"></div>
<div id="cartSummary"></div>
</div>
</main>

<script>
function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function getCart(){return JSON.parse(localStorage.getItem("ep_cart")||"[]")}
function saveCart(c){localStorage.setItem("ep_cart",JSON.stringify(c))}
function render(){
  const cart=getCart(), list=document.querySelector("#cartList"), summary=document.querySelector("#cartSummary");
  if(!cart.length){
    list.innerHTML='<div class="ep-empty">Seu carrinho está vazio.<br><br><button class="ep-primary" onclick="location.href=\'/\'">Ver produtos</button></div>';
    summary.innerHTML="";
    return;
  }
  list.innerHTML=cart.map((item,i)=>`
    <div class="ep-cart-item">
      <img src="${item.image||''}" alt="">
      <div>
        <div class="ep-cart-name">${escapeHtml(item.name)}</div>
        <div class="ep-cart-price">${money(item.price)}</div>
        <div class="ep-cart-controls">
          <button onclick="changeQty(${i},-1)">−</button>
          <strong style="color:#fff">${item.qty}</strong>
          <button onclick="changeQty(${i},1)">+</button>
          <button class="ep-cart-remove" onclick="removeItem(${i})">Remover</button>
        </div>
      </div>
      <strong style="color:#fff">${money(item.price*item.qty)}</strong>
    </div>`).join("");
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  summary.innerHTML=`
    <div class="ep-cart-total"><span>Total</span><span>${money(total)}</span></div>
    <div class="ep-cart-actions">
      <button class="ep-secondary" onclick="clearCart()">Esvaziar carrinho</button>
      <button class="ep-primary" onclick="location.href='/checkout.html'">Ir para pagamento</button>
    </div>`;
}
function changeQty(i,d){const c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);render()}
function removeItem(i){const c=getCart();c.splice(i,1);saveCart(c);render()}
function clearCart(){if(confirm("Deseja esvaziar o carrinho?")){saveCart([]);render()}}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body>
</html>
